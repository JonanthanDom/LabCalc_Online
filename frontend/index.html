<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>

  <title>LabCalc - Login</title>

  <link rel="stylesheet" href="style.css">
</head>

<body class="login-body">

  <div class="login-container">

    <div class="login-card">

      <div class="login-logo">
        <h1>LabCalc</h1>
        <p>Sistema de Calculadoras Clínicas</p>
      </div>

      <div class="input-group">
        <label>Usuário</label>

        <input
          type="text"
          id="usuario"
          placeholder="Digite seu usuário"
        >
      </div>

      <div class="input-group">
        <label>Senha</label>

        <input
          type="password"
          id="senha"
          placeholder="Digite sua senha"
        >
      </div>

      <button onclick="login()">
        Entrar
      </button>

      <div class="resultado" id="resultado_login">
        Utilize qualquer usuário e senha.
      </div>

    </div>

  </div>

  <script src="script.js"></script>

</body>
